name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines 声明 >=22；22 与 24 的类型剥离行为不同，两个都要过。
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # One public gate: build + typecheck + fake-host integration tests,
      # generated-artifact sync, datasets, then install/import the actual tarball.
      - run: npm run verify

  # 摘要清理和认领记录依赖 rename 覆盖、O_EXCL 创建和进程存活探测，这些在 macOS / Windows 上行为不同。
  # 全量 verify 仍只在 ubuntu 跑；这里只跑 summary-file 测试。
  cleanup:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node --experimental-strip-types --test test/summary-file.test.mjs

  # 聚合闸：分支保护要求的检查名是 `build`。矩阵会把它拆成 build (22)/(24)，
  # 因此用这个字面名为 build 的汇聚 job。依赖失败或取消时 GitHub 会把 needs 的 job 记成
  # skipped，而 skipped 能满足必需检查；所以总是运行，并逐个核对上游结果。
  build:
    runs-on: ubuntu-latest
    needs: [build-matrix, cleanup]
    if: always()
    steps:
      - run: test "${{ needs.build-matrix.result }}" = success
      - run: test "${{ needs.cleanup.result }}" = success
