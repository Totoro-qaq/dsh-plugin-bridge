name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines 声明 >=22；22 与 24 的类型剥离行为不同，两个都要过。
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # One public gate: build + typecheck + fake-host integration tests,
      # generated-artifact sync, datasets, then install/import the actual tarball.
      - run: npm run verify

  # 聚合闸：分支保护要求的检查名是 `build`，矩阵会把它拆成 build (22)/(24)，
  # 因此用这个与矩阵同结果的汇聚 job 提供字面名为 build 的检查。
  build:
    runs-on: ubuntu-latest
    needs: build-matrix
    steps:
      - run: echo "build-matrix green on node 22 & 24"
